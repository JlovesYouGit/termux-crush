name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Decode keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo $KEYSTORE_BASE64 | base64 --decode > keystore.jks

    - name: Build Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        chmod +x ./gradlew
        ./gradlew assembleRelease

    - name: Sign APK
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Rename APK
      run: |
        mv app/build/outputs/apk/release/app-release-unsigned-aligned.apk termux-crush-${{ github.ref_name }}.apk

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: termux-crush-${{ github.ref_name }}.apk
        body: |
          Release of Termux Crush App ${{ github.ref_name }}
          
          This release includes:
          - APK for Android installation
          - Integration with Termux and Rapped
          - AI-powered coding assistance
          
          To install:
          1. Download the APK
          2. Install on your Android device
          3. Use with Termux and Rapped
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}