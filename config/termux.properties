# Termux Properties for Crush App
# This file configures the default behavior of the Termux Crush App

# Allow external applications to execute commands in Termux
allow-external-apps=true

# Default working directory
default-working-directory=/data/data/com.termux.crush/files/home

# Enable vi key bindings
vi-key-bindings=true

# Enable terminal session toolbar
terminal-toolbar=true

# Set default shell
default-shell=bash

# Enable logging
log-level=INFO

# Package configuration
packages-crush=true
packages-git=true
packages-golang=true
packages-vim=true
packages-neovim=true

# Auto-start configuration
auto-start-crush=true

# Environment variables
env-vars=EDITOR=vim,TERM=xterm-256color